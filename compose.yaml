# Mend, self-hosted: the product image plus Postgres, pointed at your existing
# Sealant control plane. Nothing leaves your machines.
#
#   SEALANT_BASE_URL=http://host.docker.internal:8080 \
#   SEALANT_API_KEY=... \
#   BETTER_AUTH_SECRET=$(openssl rand -base64 32) \
#   docker compose up
services:
  mend:
    build: .
    ports:
      - "${MEND_PORT:-3000}:3000"
    environment:
      MEND_MODE: all
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgres://mend:${POSTGRES_PASSWORD:-mend}@postgres:5432/mend
      # Generate one: openssl rand -base64 32. The default is dev-grade only.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-mend-compose-secret-change-me-please}
      # Your Sealant control plane; host.docker.internal reaches the host.
      SEALANT_BASE_URL: ${SEALANT_BASE_URL:-http://host.docker.internal:8080}
      SEALANT_API_KEY: ${SEALANT_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mend}
      POSTGRES_DB: mend
    volumes:
      - mend-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mend -d mend"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mend-pgdata:
