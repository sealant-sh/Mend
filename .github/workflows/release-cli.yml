# Release the mend CLI: a cli-v*.*.* tag publishes @sealant/mend to npm via OIDC Trusted
# Publishing — tokenless, mirroring Core's release.yml npm job. One-time setup on npm (after the
# first manual publish; trusted publishing only attaches to an existing package): register a
# Trusted Publisher on @sealant/mend pointing at sealant-sh/Mend + release-cli.yml + the `release`
# environment, and create that protected environment in repo settings.
name: Release CLI

on:
  push:
    tags:
      - "cli-v*.*.*"

permissions:
  contents: read

jobs:
  npm:
    name: Publish @sealant/mend
    # Github-hosted runner on purpose: the OIDC id-token should be minted on
    # infrastructure GitHub controls.
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # .node-version (26.x) also satisfies trusted publishing's npm >= 11.5 floor.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # --lockfile=false: CI must never write pnpm-lock.yaml (AGENTS.md).
      - run: pnpm install --lockfile=false --ignore-scripts

      # The git tag is the single version authority: overwrite the package
      # version from it so the published version always matches the release.
      - name: Sync package version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          pnpm --filter "@sealant/mend" exec npm version "$VERSION" --no-git-tag-version --allow-same-version

      # `prepack` builds dist/ from src/main.ts; publish runs it.
      - name: Publish to npm
        run: pnpm --filter "@sealant/mend" publish --access public --no-git-checks --provenance

  # A tag is not a release until the repo says so: publish a GitHub Release whose notes are the
  # version's CHANGELOG section, so every cli-v* tag leaves a durable, linkable release object.
  github-release:
    name: GitHub release
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          awk -v version="$VERSION" '
            $0 ~ "^## " version "$" { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' apps/cli/CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "No CHANGELOG section found for $VERSION — using a pointer instead." >&2
            echo "See apps/cli/CHANGELOG.md." > release-notes.md
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             --title "mend CLI ${GITHUB_REF_NAME#cli-v}"             --notes-file release-notes.md             --verify-tag
