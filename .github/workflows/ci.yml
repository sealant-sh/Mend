name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # --lockfile=false: CI must never write pnpm-lock.yaml (AGENTS.md);
      # switch to --frozen-lockfile once the lockfile is refreshed by a human.
      - run: pnpm install --lockfile=false
      # Build first: the vite builds generate the gitignored routeTree.gen.ts
      # files that typecheck needs — CI was red for weeks on exactly this.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
