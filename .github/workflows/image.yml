name: Image

# Images are RELEASES: a v* (or legacy cli-v*) tag publishes `mend` (combined,
# scripts/serve.mjs — the single-host/VPS shape), `mend-api` and `mend-web` to
# GHCR with the semver tag + `latest`. Every image is multi-arch
# (amd64 + arm64), and each architecture builds on its NATIVE runner — the
# arm64 half of the API build spent 40+ minutes under QEMU emulating a
# production install of the full dependency tree; on a real arm64 runner it
# takes minutes. The per-arch jobs push by digest; a merge job stitches the
# manifest list per image. workflow_dispatch rebuilds ad hoc (tagging by
# branch, or by the `version` input).

on:
  push:
    tags: ["v*.*.*", "cli-v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag images as this version (e.g. 0.8.0) instead of the branch name"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'sealant-sh/mend'
    strategy:
      matrix:
        image:
          - { name: mend, dockerfile: Dockerfile }
          - { name: mend-api, dockerfile: apps/api/Dockerfile }
          - { name: mend-web, dockerfile: apps/web/Dockerfile }
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          # Push by digest only; the merge job owns the human-readable tags.
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        name: [mend, mend-api, mend-web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=match,pattern=^cli-v(.*)$,group=1
            type=match,pattern=^v(.*)$,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' && github.event_name == 'workflow_dispatch' }}
            type=ref,event=branch,enable=${{ inputs.version == '' && github.event_name == 'workflow_dispatch' }}
      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.meta.outputs.version }}
