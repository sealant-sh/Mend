name: Image

# Images are RELEASES: a cli-v* tag (cut by the changesets flow) publishes `mend` (combined,
# scripts/serve.mjs — the single-host/VPS shape), `mend-api` and `mend-web` to GHCR with the
# semver tag + `latest`. No per-merge builds — every image corresponds to a released version,
# and the chart's appVersion (synced by scripts/sync-chart-version.mjs in the version PR) is
# the matching default tag. workflow_dispatch stays for ad-hoc rebuilds.

on:
  push:
    tags: ["v*.*.*", "cli-v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    if: github.repository == 'sealant-sh/mend'
    strategy:
      matrix:
        include:
          - name: mend
            dockerfile: Dockerfile
          - name: mend-api
            dockerfile: apps/api/Dockerfile
          - name: mend-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=match,pattern=^cli-v(.*)$,group=1
            type=match,pattern=^v(.*)$,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
