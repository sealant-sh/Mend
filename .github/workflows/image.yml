name: Image

# Build and publish the Mend images to GHCR on pushes to main (tag `main`) and on cli-v* tags
# (semver tags): `mend` (combined, scripts/serve.mjs — the single-host/VPS shape), `mend-api`
# (apps/api/Dockerfile, filtered prod workspace) and `mend-web` (apps/web/Dockerfile, dist-only).
# The Helm chart in deploy/helm/mend defaults to the per-tier images.

on:
  push:
    branches: [main]
    tags: ["cli-v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    if: github.repository == 'sealant-sh/mend'
    strategy:
      matrix:
        include:
          - name: mend
            dockerfile: Dockerfile
          - name: mend-api
            dockerfile: apps/api/Dockerfile
          - name: mend-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=match,pattern=cli-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/cli-v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
