# Dev-only Postgres, on 5434 so it fights neither a local install (5432)
# nor the Sealant Core dev Postgres (5433) on the same machine.
# The product compose (mend + postgres + Sealant env) is compose.yaml; the
# distinct project name keeps the two stacks from recreating each other.
#
#   docker compose -f compose.dev.yaml up -d
name: mend-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mend
      POSTGRES_PASSWORD: mend
      POSTGRES_DB: mend
    ports:
      - "5434:5432"
    volumes:
      - mend-dev-pgdata:/var/lib/postgresql/data
    # `pnpm dev` runs `up -d --wait`; the healthcheck is what --wait gates on.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mend -d mend"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  mend-dev-pgdata:
