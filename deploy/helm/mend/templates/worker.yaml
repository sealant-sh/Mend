# ONE Mend process (MEND_MODE=all). The API handlers construct the session engine in-process, so
# splitting web from worker would register live sessions in one pod while the session Service
# routes to another. Until the engine is extracted, this chart runs a single replica (Recreate)
# that serves the UI/API on 3105 and the workspace session channel on 3106.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-session
  labels: {{ include "mend.labels" . | nindent 4 }}
spec:
  selector: {{ include "mend.component" (dict "root" . "name" "app") | nindent 4 }}
  ports: [{ name: session, port: {{ .Values.sessionChannel.port }}, targetPort: session }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  labels: {{ include "mend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  strategy: { type: Recreate }
  selector:
    matchLabels: {{ include "mend.component" (dict "root" . "name" "app") | nindent 6 }}
  template:
    metadata:
      labels: {{ include "mend.component" (dict "root" . "name" "app") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: {{ toYaml .Values.image.pullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mend
          image: {{ include "mend.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { containerPort: 3105, name: http }
            - { containerPort: {{ .Values.sessionChannel.port }}, name: session }
          env:
            {{- include "mend.commonEnv" . | nindent 12 }}
            - { name: MEND_MODE, value: all }
            - { name: PORT, value: "3105" }
            # The machine git key (`mend keys init`) must survive Pod replacement: it lives on
            # the store claim, mounted at its own path so it never sits inside the store tree.
            - { name: MEND_KEYS_ROOT, value: /var/lib/mend/keys }
            {{- with .Values.serviceHost.bindAddresses }}
            - { name: MEND_SERVICE_HOSTS, value: {{ join "," . | quote }} }
            {{- end }}
            - { name: MEND_SERVICE_PORT_MIN, value: {{ .Values.serviceHost.portMin | quote }} }
            - { name: MEND_SERVICE_PORT_MAX, value: {{ .Values.serviceHost.portMax | quote }} }
            - { name: MEND_SESSION_ENDPOINT_LISTEN, value: "0.0.0.0:{{ .Values.sessionChannel.port }}" }
            - { name: MEND_SESSION_ENDPOINT_URL, value: {{ include "mend.sessionEndpointUrl" . | quote }} }
            {{- if .Values.sessionChannel.tls.enabled }}
            - { name: MEND_SESSION_ENDPOINT_TLS_CERT, value: /etc/mend/session-tls/tls.crt }
            - { name: MEND_SESSION_ENDPOINT_TLS_KEY, value: /etc/mend/session-tls/tls.key }
            {{- end }}
          volumeMounts:
            - { name: store, mountPath: {{ .Values.store.mountPath }} }
            - { name: store, mountPath: /var/lib/mend/keys, subPath: .mend-keys }
            {{- if .Values.sessionChannel.tls.enabled }}
            - { name: session-tls, mountPath: /etc/mend/session-tls, readOnly: true }
            {{- end }}
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
          resources: {{ toYaml .Values.app.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      volumes:
        - name: store
          persistentVolumeClaim: { claimName: {{ include "mend.storeClaim" . }} }
        {{- if .Values.sessionChannel.tls.enabled }}
        - name: session-tls
          secret: { secretName: {{ required "sessionChannel.tls.secretName" .Values.sessionChannel.tls.secretName }} }
        {{- end }}
