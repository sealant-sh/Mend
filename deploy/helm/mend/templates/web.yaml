# The UI/API Service (the app Deployment lives in worker.yaml; one process serves both ports).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels: {{ include "mend.labels" . | nindent 4 }}
  {{- with .Values.web.service.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  selector: {{ include "mend.component" (dict "root" . "name" "app") | nindent 4 }}
  ports: [{ name: http, port: 3105, targetPort: http }]
